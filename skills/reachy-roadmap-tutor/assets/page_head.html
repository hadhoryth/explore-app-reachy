<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --ink: #15212c;
  --muted: #4e5d6b;
  --line: #c9d3dd;
  --link: #1d5a8c;
  --accent: #a85a00;
  --antenna: #ff9500;
  --code-bg: #1b2a38;
  --code-ink: #dce6ef;
  --code-muted: #8fa3b5;
  --code-key: #ffb454;
  --code-str: #9fd68a;
  --code-num: #f29e8b;
  --code-type: #8cc4f2;
  --robot-edge: #8a9aa9;
  --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Fragment Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17293a;
    --surface: #1e3347;
    --ink: #e7eef4;
    --muted: #a3b4c4;
    --line: #2f4a62;
    --link: #8cc4f2;
    --accent: #ffaa33;
    --code-bg: #10202e;
    --robot-edge: #6f8497;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17293a;
  --surface: #1e3347;
  --ink: #e7eef4;
  --muted: #a3b4c4;
  --line: #2f4a62;
  --link: #8cc4f2;
  --accent: #ffaa33;
  --code-bg: #10202e;
  --robot-edge: #6f8497;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.6; }
a { color: var(--link); text-underline-offset: 0.18em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--antenna); outline-offset: 2px; border-radius: 4px; }
img, svg { max-width: 100%; }
.page { max-width: 1180px; margin: 0 auto; padding: 0 24px 96px; }

/* Hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 48px; align-items: center; padding: 64px 0 56px; border-bottom: 1px solid var(--line); }
.hero h1 { font-size: clamp(2.3rem, 5.2vw, 3.9rem); line-height: 1.02; letter-spacing: -0.025em; font-weight: 700; margin: 0 0 20px; max-width: 14ch; }
.hero .lede { font-size: 1.2rem; line-height: 1.5; color: var(--muted); margin: 0 0 20px; max-width: 34rem; }
.hero .commands { display: grid; gap: 8px; margin: 0 0 28px; max-width: 34rem; }
.hero .commands code { display: block; font-family: var(--mono); font-size: 0.95rem; background: var(--code-bg); color: var(--code-ink); border: 0; border-radius: 10px; padding: 10px 14px; overflow-x: auto; }
.hero .commands code span { color: var(--code-muted); }
.stage { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 16px 12px; }
.stage svg { display: block; width: 100%; height: auto; }
.stage figcaption { color: var(--muted); font-size: 0.92rem; padding: 6px 8px 0; }
.step .stage { max-width: 32rem; margin: 0 0 20px; }
.start-link { display: inline-block; font-weight: 600; background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 999px; text-decoration: none; }
.start-link:hover { background: var(--link); color: #fff; }

/* Body layout */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 56px; padding-top: 48px; }
.toc { position: sticky; top: calc(24px + env(safe-area-inset-top, 0px)); align-self: start; font-size: 0.92rem; max-height: calc(100vh - 48px); overflow-y: auto; }
.toc p { font-weight: 600; margin: 0 0 8px; }
.toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
.toc li { margin: 0; }
.toc li a { display: block; padding: 3px 0 3px 14px; margin-left: -1px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; }
.toc li a:hover { color: var(--ink); border-left-color: var(--ink); }
.toc .group { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; padding: 12px 0 2px 14px; }
.toc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
.toc-head p { margin: 0; }
.toc-toggle { flex: none; display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; }
.toc-toggle:hover { color: var(--ink); border-color: var(--ink); }
.toc-toggle svg { width: 18px; height: 18px; }
.toc-toggle .chev { transform-box: fill-box; transform-origin: center; }

/* Focus mode: the contents folded away, the article centred */
@media (min-width: 961px) {
  :root[data-toc="hidden"] .layout { grid-template-columns: 32px minmax(0, 1fr); }
  :root[data-toc="hidden"] .toc-head p, :root[data-toc="hidden"] #toc-list { display: none; }
  :root[data-toc="hidden"] .toc-toggle .chev { transform: rotate(180deg); }
  :root[data-toc="hidden"] article { margin: 0 auto; }
}

article { max-width: 46rem; min-width: 0; }
article > section { margin-bottom: 64px; }
h2 { font-size: 1.75rem; line-height: 1.2; letter-spacing: -0.015em; margin: 0 0 16px; }
h3 { font-size: 1.15rem; margin: 32px 0 8px; }
p { margin: 0 0 16px; }
ul, ol { padding-left: 1.3em; margin: 0 0 16px; }
li { margin-bottom: 6px; }
code { font-family: var(--mono); font-size: 0.88em; }
:not(pre) > code { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 0.08em 0.35em; overflow-wrap: anywhere; }

/* Steps and assignments */
.step { position: relative; padding-left: 60px; margin-bottom: 56px; }
.step::before { content: attr(data-n); position: absolute; left: 0; top: -2px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.step h3 { margin-top: 4px; font-size: 1.3rem; }
.step h4 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 28px 0 8px; }
.learn { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0 0 16px; padding: 0; }
.learn li { margin: 0; font-size: 0.86rem; padding: 2px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); }
.learn li.rust { border-color: var(--link); }
.learn li.robot { border-color: var(--antenna); }
.learn li b { font-weight: 600; }

/* Code */
.code { position: relative; background: var(--code-bg); color: var(--code-ink); border-radius: 12px; margin: 0 0 20px; }
.code .file { display: block; padding: 10px 16px 0; font-size: 0.85rem; color: var(--code-muted); }
.code pre { margin: 0; padding: 14px 16px 16px; overflow-x: auto; font-family: var(--mono); font-size: 0.86rem; line-height: 1.6; tab-size: 4; }
.code pre code { font-size: inherit; }
.code .copy { position: absolute; top: 8px; right: 8px; font: inherit; font-size: 0.8rem; font-weight: 600; color: var(--code-ink); background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.code .copy:hover { background: rgba(255, 255, 255, 0.16); }
.t-com { color: var(--code-muted); font-style: italic; }
.t-key { color: var(--code-key); }
.t-str { color: var(--code-str); }
.t-num { color: var(--code-num); }
.t-type { color: var(--code-type); }
.t-todo { color: #15212c; background: var(--antenna); border-radius: 3px; padding: 0 2px; font-style: normal; }
.code pre code[data-new] { display: inline-block; min-width: 100%; }
.ln { display: block; min-height: 1.6em; margin: 0 -16px; padding: 0 16px; }
.ln.new { background: rgba(255, 149, 0, 0.14); box-shadow: inset 3px 0 0 var(--antenna); }
.new-swatch { background: color-mix(in srgb, var(--antenna) 22%, transparent); box-shadow: inset 3px 0 0 var(--antenna); padding: 0.05em 0.35em; border-radius: 3px; }
.code.output, .code.pseudo { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.code.pseudo { border-style: dashed; }
.code.output .file, .code.pseudo .file { color: var(--muted); }
.code.output .copy, .code.pseudo .copy, .solution .copy { display: none; }
.ideas { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
.ideas p { font-weight: 600; margin: 0 0 6px; }
.ideas ul { margin: 0; }
.ideas li { color: var(--muted); }
.ideas li code { color: var(--ink); }

/* Tabs */
.tabs { margin-bottom: 20px; }
.tablist { display: flex; gap: 6px; margin-bottom: 10px; }
.tablist button { font: inherit; font-size: 0.95rem; font-weight: 600; padding: 6px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.tablist button[aria-selected="true"] { border-color: var(--ink); color: var(--ink); }
[role="tabpanel"][hidden] { display: none; }

/* Notes */
.note { border-left: 4px solid var(--antenna); background: var(--surface); border-radius: 0 10px 10px 0; padding: 14px 18px; margin: 0 0 20px; }
.note p:last-child { margin-bottom: 0; }

/* Diagram */
.paths { display: grid; gap: 14px; margin: 8px 0 20px; }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.path .label { width: 100%; font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
.path .box { padding: 5px 12px; border-radius: 8px; border: 1.5px solid var(--line); font-size: 0.93rem; }
.path .box.you { border-color: var(--ink); font-weight: 600; }
.path .box.hot { border-color: var(--antenna); }
.path .arrow { color: var(--muted); }

/* Tables */
.table-wrap { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th { font-weight: 600; }
td code, th code { white-space: nowrap; }
tr.hl td { background: color-mix(in srgb, var(--antenna) 12%, transparent); }
tr.hl td:first-child { box-shadow: inset 3px 0 0 var(--antenna); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) tr.hl td { background: color-mix(in srgb, var(--antenna) 7%, transparent); } }
:root[data-theme="dark"] tr.hl td { background: color-mix(in srgb, var(--antenna) 7%, transparent); }
@media (max-width: 560px) {
  .table-wrap thead { display: none; }
  .table-wrap tr { display: block; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .table-wrap tr:last-child { border-bottom: 0; }
  .table-wrap td { display: block; border: 0; padding: 3px 14px; }
  .table-wrap td:first-child { font-weight: 600; }
}
.tree { font-family: var(--mono); font-size: 0.86rem; line-height: 1.55; }

/* Collapsibles */
details { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin-bottom: 10px; }
summary { cursor: pointer; padding: 12px 16px; font-weight: 600; }
details > div { padding: 0 16px 4px; }
details.hint summary::before { content: "Hint · "; color: var(--muted); font-weight: 500; }
details.solution { border-left: 4px solid var(--antenna); }
details.solution summary::before { content: "Solution · "; color: var(--accent); }
details[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 14px; }

footer { border-top: 1px solid var(--line); padding-top: 24px; color: var(--muted); font-size: 0.92rem; }

@media (max-width: 960px) {
  .hero { grid-template-columns: 1fr; gap: 32px; padding-top: 40px; }
  .layout { grid-template-columns: 1fr; gap: 0; }
  .toc { display: none; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .page { padding: 0 16px 72px; }
  .step { padding-left: 0; padding-top: 52px; }
  .step::before { top: 0; }
}
{{EXTRA_CSS}}</style>
<script>
  // Fold the contents before the first paint if it was folded last time.
  try { if (localStorage.getItem("roadmap-toc") === "hidden") document.documentElement.setAttribute("data-toc", "hidden"); } catch (e) {}
</script>
</head>
